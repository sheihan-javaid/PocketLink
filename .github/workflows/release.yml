name: Release

# Builds the signed universal APK for a version tag and attaches it to a DRAFT GitHub
# Release. Review the draft and publish it manually. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.1

    - name: Check tag matches versionName
      id: version
      run: |
        VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' build.gradle.kts | head -n1)
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$VERSION_NAME" != "$TAG_VERSION" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME in build.gradle.kts"
          exit 1
        fi
        echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

    - name: Check signing secrets are present
      env:
        KEYSTORE_BASE64: ${{ secrets.POCKETLINK_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.POCKETLINK_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.POCKETLINK_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.POCKETLINK_KEY_PASSWORD }}
      run: |
        for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!v}" ]; then
            echo "::error::Repository secret POCKETLINK_$v is not set. See RELEASING.md."
            exit 1
          fi
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4.3.0
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Android SDK
      run: |
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses || true
        yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" || true

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.POCKETLINK_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocketlink-release.jks"

    - name: Build signed release APK
      env:
        POCKETLINK_KEYSTORE_PATH: ${{ runner.temp }}/pocketlink-release.jks
        POCKETLINK_KEYSTORE_PASSWORD: ${{ secrets.POCKETLINK_KEYSTORE_PASSWORD }}
        POCKETLINK_KEY_ALIAS: ${{ secrets.POCKETLINK_KEY_ALIAS }}
        POCKETLINK_KEY_PASSWORD: ${{ secrets.POCKETLINK_KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Remove keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/pocketlink-release.jks"

    - name: Verify signature and checksum
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd build/outputs/apk/release
        APK="PocketLink-$VERSION.apk"
        test -f "$APK" || { echo "::error::$APK missing (was the build unsigned?)"; ls -la; exit 1; }
        "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
        sha256sum -c "$APK.sha256"

    - name: Create draft GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd build/outputs/apk/release
        gh release create "$GITHUB_REF_NAME" \
          "PocketLink-$VERSION.apk" \
          "PocketLink-$VERSION.apk.sha256" \
          --draft \
          --title "PocketLink $VERSION" \
          --generate-notes
